<!doctype html>
<html lang="fr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Melobook</title>
    
    <!-- Anti-cache meta headers for hard refresh in desktop browsers -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <script>
      // Suppress sandbox-specific Vite HMR WebSocket connection logs
      window.addEventListener('error', function(e) {
        if (e.message && (e.message.includes('WebSocket') || e.message.includes('createWebSocketModuleRunnerTransport'))) {
          e.stopImmediatePropagation();
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && (String(e.reason).includes('WebSocket') || String(e.reason).includes('createWebSocketModuleRunnerTransport'))) {
          e.preventDefault();
        }
      });
      // Apply saved theme & global branding immediately before paint (projection mode always stays dark)
      (function() {
        try {
          var isPresentation = window.location.search.indexOf('mode=presentation') !== -1 || window.location.hash === '#presentation';
          var raw = localStorage.getItem('songbook_stage_settings');
          var parsedSettings = raw ? JSON.parse(raw) : null;
          if (parsedSettings && parsedSettings.reduceMotion === true) {
            document.documentElement.classList.add('reduce-motion');
          }

          var rawBrand = localStorage.getItem('melobook_app_branding');
          if (rawBrand && !isPresentation) {
            var brand = JSON.parse(rawBrand);
            var hexRe = /^#[0-9a-fA-F]{6}$/;
            var root = document.documentElement;
            if (brand && hexRe.test(brand.lightBgColor || '')) root.style.setProperty('--app-bg-light', brand.lightBgColor);
            if (brand && hexRe.test(brand.lightSurfaceColor || '')) root.style.setProperty('--app-surface-light', brand.lightSurfaceColor);
            if (brand && hexRe.test(brand.darkBgColor || '')) root.style.setProperty('--app-bg-dark', brand.darkBgColor);
            if (brand && hexRe.test(brand.darkSurfaceColor || '')) root.style.setProperty('--app-surface-dark', brand.darkSurfaceColor);
            if (
              brand &&
              (brand.lightBgColor !== '#F4F6F9' ||
               brand.lightSurfaceColor !== '#FFFFFF' ||
               brand.darkBgColor !== '#0A0A0B' ||
               brand.darkSurfaceColor !== '#111112')
            ) {
              root.setAttribute('data-custom-surface', 'true');
            }
            var fontMap = {
              'plus-jakarta-sans': ["'Plus Jakarta Sans', system-ui, sans-serif", null],
              'outfit': ["'Outfit', system-ui, sans-serif", 'Outfit:wght@400;500;600;700;800'],
              'manrope': ["'Manrope', system-ui, sans-serif", 'Manrope:wght@400;500;600;700;800'],
              'dm-sans': ["'DM Sans', system-ui, sans-serif", 'DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400'],
              'bricolage-grotesque': ["'Bricolage Grotesque', system-ui, sans-serif", 'Bricolage+Grotesque:wght@400;500;600;700;800'],
              'public-sans': ["'Public Sans', system-ui, sans-serif", 'Public+Sans:wght@400;500;600;700;800'],
              'playfair-display': ["'Playfair Display', Georgia, serif", 'Playfair+Display:ital,wght@0,400;0,600;0,700;1,400'],
              'lora': ["'Lora', Georgia, serif", 'Lora:ital,wght@0,400;0,500;0,600;0,700;1,400']
            };
            var fontSpec = brand && fontMap[brand.fontFamily];
            if (fontSpec) {
              root.style.setProperty('--font-sans', fontSpec[0]);
              if (fontSpec[1]) {
                var fontLink = document.createElement('link');
                fontLink.id = 'melobook-dynamic-font';
                fontLink.rel = 'stylesheet';
                fontLink.href = 'https://fonts.googleapis.com/css2?family=' + fontSpec[1] + '&display=swap';
                document.head.appendChild(fontLink);
              }
            }
          }

          if (isPresentation) {
            document.documentElement.classList.add('dark');
            return;
          }
          var theme = parsedSettings ? parsedSettings.theme : 'dark';
          var metaTheme = document.querySelector('meta[name="theme-color"]');
          if (theme === 'light') {
            document.documentElement.classList.remove('dark');
            if (metaTheme) metaTheme.setAttribute('content', '#F4F6F9');
          } else {
            document.documentElement.classList.add('dark');
            if (metaTheme) metaTheme.setAttribute('content', '#090d16');
          }
        } catch (err) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

    <!-- PWA & Mobile Web App Meta -->
    <meta name="description" content="Application PWA complète de gestion de chants et de setlists au format ChordPro pour musiciens et groupes, avec mode scène, transposition en temps réel, auto-scroll et synchronisation." />
    <meta property="og:title" content="Melobook" />
    <meta property="og:description" content="Application PWA complète de gestion de chants et de setlists au format ChordPro pour musiciens et groupes, avec mode scène, transposition en temps réel, auto-scroll et synchronisation." />
    <meta name="theme-color" content="#090d16" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Melobook" />
    <link rel="apple-touch-icon" href="/icon.svg?v=20261124-01" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg?v=20261124-01" />
    <link rel="manifest" href="/manifest.json?v=20261124-01" />

    <!-- Google Fonts: Plus Jakarta Sans (UI) & JetBrains Mono (Chords/Lyrics) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <meta property="og:image" content="https://bolt.new/static/og_default.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png">
</head>
  <body class="bg-[#F4F6F9] text-slate-900 dark:bg-[#0A0A0B] dark:text-[#E0E0E0] antialiased selection:bg-blue-600/20 dark:selection:bg-indigo-500/30 selection:text-blue-900 dark:selection:text-indigo-200 overflow-x-hidden min-h-screen transition-colors duration-150">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
