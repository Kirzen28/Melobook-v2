<!doctype html>
<html lang="fr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Melobook</title>
    
    <!-- Anti-cache meta headers for hard refresh in desktop browsers -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <script>
      // Suppress sandbox-specific Vite HMR WebSocket connection logs
      window.addEventListener('error', function(e) {
        if (e.message && (e.message.includes('WebSocket') || e.message.includes('createWebSocketModuleRunnerTransport'))) {
          e.stopImmediatePropagation();
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && (String(e.reason).includes('WebSocket') || String(e.reason).includes('createWebSocketModuleRunnerTransport'))) {
          e.preventDefault();
        }
      });
    </script>

    <!-- PWA & Mobile Web App Meta -->
    <meta name="description" content="Application PWA complète de gestion de chants et de setlists au format ChordPro pour musiciens et groupes, avec mode scène, transposition en temps réel, auto-scroll et synchronisation." />
    <meta property="og:title" content="Melobook" />
    <meta property="og:description" content="Application PWA complète de gestion de chants et de setlists au format ChordPro pour musiciens et groupes, avec mode scène, transposition en temps réel, auto-scroll et synchronisation." />
    <meta name="theme-color" content="#090d16" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Melobook" />
    <link rel="apple-touch-icon" href="/icon.svg?v=20261008-02" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg?v=20261008-02" />
    <link rel="manifest" href="/manifest.json?v=20261008-02" />

    <!-- Google Fonts: Plus Jakarta Sans (UI) & JetBrains Mono (Chords/Lyrics) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <meta property="og:image" content="https://bolt.new/static/og_default.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png">
</head>

    <script type="module" src="/src/main.tsx"></script>

</html>
