<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  
  <!-- Rounded Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="4"/>

  <!-- Music Book Silhouette -->
  <path d="M 120 150 C 180 130, 230 145, 256 165 C 282 145, 332 130, 392 150 L 392 370 C 332 350, 282 365, 256 385 C 230 365, 180 350, 120 370 Z" 
        fill="#1e293b" stroke="url(#accentGrad)" stroke-width="8" stroke-linejoin="round"/>
  
  <!-- Center spine divider -->
  <path d="M 256 165 L 256 385" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>

  <!-- Musical Notes Floating -->
  <g transform="translate(180, 210) scale(1.1)">
    <!-- Chord Sheet lines -->
    <line x1="-30" y1="10" x2="30" y2="10" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <line x1="-30" y1="30" x2="30" y2="30" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <line x1="-30" y1="50" x2="20" y2="50" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Glowing Eighth Notes & Chord symbol -->
  <g transform="translate(300, 230)">
    <circle cx="20" cy="40" r="14" fill="url(#goldGrad)"/>
    <circle cx="50" cy="30" r="14" fill="url(#goldGrad)"/>
    <path d="M 34 40 L 34 0 L 64 -10 L 64 30" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 34 0 L 64 -10" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round"/>
  </g>
</svg>
